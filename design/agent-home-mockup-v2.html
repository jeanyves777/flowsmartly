<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlowSmartly — Agent Home v2 (brand-unified)</title>
<style>
  /* ===== Real FlowSmartly tokens (globals.css HSL) — light + dark ===== */
  :root{
    --background:0 0% 100%;        --foreground:240 10% 3.9%;
    --card:0 0% 100%;             --panel:240 4.8% 97.5%;   --elevated:0 0% 100%;
    --muted:240 4.8% 95.9%;       --muted-foreground:240 3.8% 46.1%;
    --border:240 5.9% 90%;        --input:240 5.9% 90%;
    --primary:199 89% 48%;        --primary-foreground:0 0% 100%;
    --ring:199 89% 48%;
    --brand:#0ea5e9; --brand2:#8b5cf6; --gold:#eccb93;
    --grad:linear-gradient(100deg,#0ea5e9,#8b5cf6);
    --loader:linear-gradient(135deg,#3b82f6,#8b5cf6 50%,#f59e0b);
    --ok:160 84% 39%; --warn:38 92% 50%; --bad:0 84% 60%;
    --shadow:0 12px 40px rgba(15,23,42,.10);
    --radius:14px;
    color-scheme:light;
  }
  html.dark{
    --background:240 10% 3.9%;     --foreground:0 0% 98%;
    --card:240 8% 6.5%;            --panel:240 7% 9%;        --elevated:240 7% 11%;
    --muted:240 3.7% 15.9%;        --muted-foreground:240 5% 64.9%;
    --border:240 3.7% 16%;         --input:240 3.7% 18%;
    --primary:199 89% 48%;         --primary-foreground:0 0% 100%;
    --ring:199 89% 55%;
    --shadow:0 14px 46px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif; font-size:14px;
    color:hsl(var(--foreground));
    background:
      radial-gradient(1100px 600px at 82% -10%, hsl(var(--primary)/.12), transparent 60%),
      radial-gradient(900px 600px at -5% 110%, hsl(262 83% 58%/.10), transparent 55%),
      hsl(var(--background));
    display:grid; grid-template-columns:84px 1fr; grid-template-rows:56px 1fr; height:100vh; overflow:hidden;
    transition:background .25s,color .25s;
  }
  body.rtl{direction:rtl; grid-template-columns:1fr 84px}
  body.rtl .rail{grid-column:2/3; border-right:none; border-left:1px solid hsl(var(--border))}
  body.rtl .main{grid-column:1/2}
  .t-muted{color:hsl(var(--muted-foreground))}

  /* ===== top bar ===== */
  .topbar{grid-column:1/3; display:flex; align-items:center; gap:12px; padding:0 18px;
    border-bottom:1px solid hsl(var(--border)); background:hsl(var(--background)/.72); backdrop-filter:blur(10px); z-index:5}
  body.rtl .topbar{grid-column:1/3}
  .brand{display:flex; align-items:center; gap:10px}
  .brand .mk{width:30px;height:30px;border-radius:9px;overflow:hidden;flex:none;box-shadow:0 4px 14px hsl(var(--primary)/.35);background:#fff;display:grid;place-items:center}
  .brand .mk img{width:100%;height:100%;object-fit:contain}
  .brand .wm{font-weight:800;letter-spacing:-.2px;font-size:16px}
  .brand .wm .s{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brandchip{margin-inline-start:6px;display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid hsl(var(--border));
    border-radius:999px;background:hsl(var(--panel));color:hsl(var(--muted-foreground));font-size:12.5px;cursor:pointer}
  .brandchip b{color:hsl(var(--foreground))}
  .spacer{flex:1}
  .credits{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12.5px;
    background:linear-gradient(120deg,hsl(var(--primary)/.14),hsl(262 83% 58%/.14));border:1px solid hsl(var(--border))}
  .credits b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid hsl(var(--border));background:hsl(var(--panel));
    display:grid;place-items:center;cursor:pointer;color:hsl(var(--muted-foreground));position:relative;transition:.15s}
  .iconbtn:hover{color:hsl(var(--foreground));border-color:hsl(var(--primary)/.6)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* language menu */
  .menu{position:absolute;top:46px;inset-inline-end:0;min-width:210px;max-height:340px;overflow:auto;background:hsl(var(--elevated));
    border:1px solid hsl(var(--border));border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:30}
  .menu.open{display:block}
  .menu .mi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .menu .mi:hover{background:hsl(var(--muted))}
  .menu .mi .code{margin-inline-start:auto;font-size:10.5px;color:hsl(var(--muted-foreground));text-transform:uppercase}
  .menu .mi.on{background:hsl(var(--primary)/.12);color:hsl(var(--primary))}

  /* ===== workspace rail ===== */
  .rail{grid-row:2/3; border-right:1px solid hsl(var(--border)); background:hsl(var(--card)/.5);
    display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:3px}
  .rail .item{width:66px; padding:10px 0; border-radius:13px; display:flex; flex-direction:column; align-items:center; gap:6px;
    color:hsl(var(--muted-foreground)); cursor:pointer; transition:.15s; position:relative}
  .rail .item:hover{color:hsl(var(--foreground)); background:hsl(var(--muted))}
  .rail .item.active{color:hsl(var(--foreground)); background:linear-gradient(135deg,hsl(var(--primary)/.22),hsl(262 83% 58%/.16))}
  .rail .item.active::before{content:"";position:absolute;inset-inline-start:-1px;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--grad)}
  .rail .item span{font-size:10px;letter-spacing:.2px}
  .rail svg.i{width:21px;height:21px}
  .rail .sep{height:1px;width:44px;background:hsl(var(--border));margin:7px 0}

  /* ===== main ===== */
  .main{grid-row:2/3; overflow:hidden; display:flex; flex-direction:column; position:relative}
  .convo{flex:1; overflow-y:auto; padding:26px clamp(16px,6vw,110px) 150px}
  .convo::-webkit-scrollbar{width:10px} .convo::-webkit-scrollbar-thumb{background:hsl(var(--border));border-radius:8px}

  .hero{max-width:780px;margin:7vh auto 0}
  .hero h1{font-size:31px;margin:0 0 8px;font-weight:800;letter-spacing:-.5px;line-height:1.12}
  .hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{color:hsl(var(--muted-foreground));margin:0 0 22px;font-size:15px;line-height:1.55}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{padding:9px 13px;border:1px solid hsl(var(--border));border-radius:11px;background:hsl(var(--panel));color:hsl(var(--foreground));
    cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center;transition:.15s}
  .chip:hover{border-color:hsl(var(--primary)/.6);transform:translateY(-1px)}
  .chip svg.i{width:15px;height:15px;color:hsl(var(--primary))}
  .seed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:11px;margin-top:26px}
  .seed{border:1px solid hsl(var(--border));border-radius:13px;padding:14px;background:hsl(var(--panel));cursor:pointer;transition:.15s}
  .seed:hover{border-color:hsl(var(--primary)/.6);transform:translateY(-2px);box-shadow:var(--shadow)}
  .seed .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:9px;
    background:linear-gradient(135deg,hsl(var(--primary)/.18),hsl(262 83% 58%/.18));color:hsl(var(--primary))}
  .seed .t{font-weight:650;margin-bottom:3px;font-size:13px}
  .seed .d{color:hsl(var(--muted-foreground));font-size:11.5px;line-height:1.45}

  /* messages */
  .msg{max-width:840px;margin:0 auto 20px;display:flex;gap:13px}
  .msg .who{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
  .msg.user .who{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
  .msg.ai .who{background:#fff;padding:4px}
  .msg.ai .who img{width:100%;height:100%;object-fit:contain}
  .msg .body{flex:1;min-width:0}
  .msg.user{flex-direction:row-reverse}
  .msg.user .bubble{background:hsl(var(--primary)/.12);border:1px solid hsl(var(--primary)/.25);border-radius:13px;padding:10px 14px;display:inline-block}
  .think{font-size:12.5px;color:hsl(var(--muted-foreground));display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer}
  .think .sp{width:14px;height:14px;flex:none}
  .aitext{line-height:1.62}
  .aitext b{font-weight:700}

  /* generic card */
  .card{border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card));
    margin-top:12px;overflow:hidden;box-shadow:var(--shadow)}
  .card .hd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid hsl(var(--border));font-size:12.5px;color:hsl(var(--muted-foreground))}
  .card .hd svg.i{width:16px;height:16px;color:hsl(var(--primary))}
  .card .hd .tag{margin-inline-start:auto;font-size:10.5px;padding:2px 9px;border-radius:999px;border:1px solid hsl(var(--border))}
  .card .bd{padding:14px}
  .row{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
  .btn{padding:9px 15px;border-radius:10px;border:1px solid hsl(var(--border));background:hsl(var(--panel));color:hsl(var(--foreground));
    cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:hsl(var(--primary)/.6)}
  .btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px hsl(var(--primary)/.35)}
  .btn.ghost{background:transparent;color:hsl(var(--muted-foreground))}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border-radius:999px}
  .badge.ok{background:hsl(var(--ok)/.14);color:hsl(var(--ok));border:1px solid hsl(var(--ok)/.3)}

  /* plan card */
  .plan .step{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
  .plan .step .n{width:20px;height:20px;border-radius:6px;background:hsl(var(--muted));border:1px solid hsl(var(--border));display:grid;place-items:center;font-size:11px;flex:none;color:hsl(var(--primary));font-weight:700}
  .plan .cost{margin-top:8px;color:hsl(var(--muted-foreground));font-size:12px}
  .progress{height:7px;border-radius:6px;background:hsl(var(--muted));overflow:hidden;margin:12px 0 8px}
  .progress > i{display:block;height:100%;width:0;background:var(--grad);transition:width .5s}

  /* editable canvas artifact */
  .canvas-wrap{display:grid;grid-template-columns:1fr 244px}
  body.rtl .canvas-wrap{grid-template-columns:244px 1fr}
  .stage{padding:20px;display:grid;place-items:center;background:
    radial-gradient(360px 220px at 30% 0%, hsl(var(--primary)/.16), transparent 70%), hsl(var(--background))}
  .poster{width:300px;height:300px;border-radius:16px;position:relative;overflow:hidden;color:#fff;direction:ltr;
    box-shadow:0 20px 50px rgba(0,0,0,.45);background:linear-gradient(160deg,#0b2447,#0a1b3a)}
  .poster .pbg{position:absolute;inset:0;background:
    radial-gradient(180px 180px at 82% 80%, var(--acc,#0ea5e9) 0%, transparent 62%),
    radial-gradient(150px 150px at 16% 18%, rgba(255,255,255,.08), transparent 60%)}
  .poster .pin{position:absolute;inset:0;padding:24px;display:flex;flex-direction:column}
  .poster .eyebrow{font-size:9px;letter-spacing:2.5px;color:rgba(255,255,255,.7);text-transform:uppercase}
  .poster .ph{font-size:27px;font-weight:800;line-height:1.05;margin-top:auto;letter-spacing:-.5px}
  .poster .psub{font-size:11px;color:rgba(255,255,255,.8);margin-top:8px;line-height:1.4;max-width:80%}
  .poster .pcta{margin-top:14px;align-self:flex-start;background:var(--acc,#0ea5e9);color:#06121f;font-weight:800;font-size:10px;padding:7px 13px;border-radius:999px}
  .poster .pfoot{position:absolute;left:24px;right:24px;bottom:12px;font-size:8px;color:rgba(255,255,255,.62);
    border-top:1px solid rgba(255,255,255,.18);padding-top:6px;display:flex;gap:8px}
  .editor{border-inline-start:1px solid hsl(var(--border));padding:14px;background:hsl(var(--panel))}
  .tabs{display:flex;gap:4px;margin-bottom:12px;background:hsl(var(--muted));padding:3px;border-radius:9px}
  .tabs .tb{flex:1;text-align:center;font-size:11.5px;padding:6px;border-radius:7px;cursor:pointer;color:hsl(var(--muted-foreground))}
  .tabs .tb.on{background:hsl(var(--elevated));color:hsl(var(--foreground));box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:11px;color:hsl(var(--muted-foreground));margin-bottom:4px}
  .field input{width:100%;background:hsl(var(--input)/.4);border:1px solid hsl(var(--border));border-radius:8px;color:hsl(var(--foreground));
    padding:7px 9px;font-size:12.5px;font-family:inherit}
  .field input:focus{outline:none;border-color:hsl(var(--primary))}
  .swatches{display:flex;gap:7px;margin-bottom:6px}
  .sw{width:24px;height:24px;border-radius:7px;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:hsl(var(--foreground))}
  .mini{font-size:10.5px;color:hsl(var(--muted-foreground));margin:6px 0;line-height:1.45}

  /* pipeline flow card */
  .flow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
  .node{flex:none;width:152px;border:1px solid hsl(var(--border));border-radius:11px;background:hsl(var(--panel));overflow:hidden}
  .node .thumb{height:74px;background:linear-gradient(135deg,hsl(var(--muted)),hsl(var(--elevated)));display:grid;place-items:center;color:hsl(var(--muted-foreground));font-size:20px}
  .node .meta{padding:8px 9px}
  .node .meta .nm{font-size:11.5px;font-weight:600;margin-bottom:5px}
  .st{font-size:10px;padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .st.ready{background:hsl(var(--ok)/.14);color:hsl(var(--ok))}
  .st.run{background:hsl(var(--warn)/.16);color:hsl(var(--warn))}
  .st.queue{background:hsl(var(--muted-foreground)/.14);color:hsl(var(--muted-foreground))}
  .st .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .st.run .d{animation:pulse 1s infinite}
  .arrow{flex:none;align-self:center;color:hsl(var(--muted-foreground))}

  /* composer */
  .composer{position:absolute;left:0;right:0;bottom:0;padding:14px clamp(16px,6vw,110px) 18px;
    background:linear-gradient(180deg,transparent,hsl(var(--background)) 34%)}
  .cbox{max-width:840px;margin:0 auto;border:1px solid hsl(var(--border));border-radius:16px;background:hsl(var(--elevated));
    box-shadow:var(--shadow)}
  .cbox .topline{display:flex;align-items:center;gap:8px;padding:9px 12px 0}
  .cmodel{font-size:11.5px;color:hsl(var(--muted-foreground));display:flex;align-items:center;gap:6px;
    border:1px solid hsl(var(--border));border-radius:999px;padding:3px 9px;cursor:pointer}
  .cmodel b{color:hsl(var(--foreground))}
  .cbox .inrow{display:flex;align-items:flex-end;gap:10px;padding:8px 12px 12px}
  .cbox textarea{flex:1;background:transparent;border:none;resize:none;color:hsl(var(--foreground));font-family:inherit;font-size:14.5px;
    max-height:120px;min-height:24px;line-height:1.5;outline:none}
  .send{width:38px;height:38px;border-radius:11px;border:none;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center}
  .hint{max-width:840px;margin:8px auto 0;color:hsl(var(--muted-foreground));font-size:11px;text-align:center}
  .kbd{font-size:10px;border:1px solid hsl(var(--border));border-radius:5px;padding:1px 5px;color:hsl(var(--muted-foreground))}

  /* slide-in workspace panel */
  .wspanel{position:absolute;top:0;inset-inline-end:0;bottom:0;width:min(440px,46vw);background:hsl(var(--card));
    border-inline-start:1px solid hsl(var(--border));box-shadow:var(--shadow);transform:translateX(100%);transition:.28s;z-index:20;display:flex;flex-direction:column}
  body.rtl .wspanel{transform:translateX(-100%)}
  .wspanel.open{transform:none}
  .wspanel .wh{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid hsl(var(--border))}
  .wspanel .wh b{font-size:15px}
  .wspanel .wh .x{margin-inline-start:auto;cursor:pointer;color:hsl(var(--muted-foreground));font-size:18px}
  .wspanel .wc{padding:16px;overflow:auto;color:hsl(var(--muted-foreground));font-size:13px;line-height:1.6}
  .wspanel .wc .pillrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .pill{font-size:10.5px;color:hsl(var(--muted-foreground));border:1px solid hsl(var(--border));border-radius:999px;padding:3px 9px}

  /* ===== unified loader (PageLoader replica) ===== */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes glow{0%,100%{box-shadow:0 0 12px rgba(139,92,246,.2),0 0 40px rgba(59,130,246,.12)}50%{box-shadow:0 0 22px rgba(139,92,246,.45),0 0 54px rgba(59,130,246,.22)}}
  .fs-loader{display:flex;flex-direction:column;align-items:center;gap:18px}
  .fs-ring{position:relative;width:80px;height:80px;display:grid;place-items:center}
  .fs-ring svg{position:absolute;inset:0;animation:spin 2.5s linear infinite}
  .fs-ring .mk{width:40px;height:40px;border-radius:11px;overflow:hidden;background:#fff;animation:glow 2.5s ease-in-out infinite;z-index:2}
  .fs-ring .mk img{width:100%;height:100%;object-fit:contain}
  .fs-tip{font-size:13px;color:hsl(var(--muted-foreground))}
  .fs-spin{width:1em;height:1em;animation:spin 1.5s linear infinite;display:inline-block;vertical-align:-2px}

  .boot{position:fixed;inset:0;background:hsl(var(--background));display:grid;place-items:center;z-index:100;transition:opacity .4s}
  .boot.hide{opacity:0;pointer-events:none}

  .note{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:hsl(var(--elevated));border:1px solid hsl(var(--border));
    padding:8px 14px;border-radius:10px;font-size:12.5px;color:hsl(var(--foreground));opacity:0;transition:.25s;z-index:120;box-shadow:var(--shadow)}
  .note.show{opacity:1}
  .fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <!-- boot loader (unified PageLoader) -->
  <div class="boot" id="boot">
    <div class="fs-loader">
      <div class="fs-ring">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="37" fill="none" stroke="hsl(var(--muted))" stroke-width="3"/>
          <circle cx="40" cy="40" r="37" fill="none" stroke="url(#bg)" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="232" stroke-dashoffset="162"/>
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient></defs>
        </svg>
        <div class="mk"><img src="../public/icon.png" alt="FlowSmartly" onerror="this.parentNode.innerHTML='&lt;div style=&quot;width:100%;height:100%;background:var(--grad);border-radius:11px&quot;&gt;&lt;/div&gt;'"></div>
      </div>
      <div class="fs-tip" id="bootTip">Loading your workspace…</div>
    </div>
  </div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <div class="mk"><img src="../public/icon.png" alt="FlowSmartly" onerror="this.parentNode.style.background='var(--grad)';this.remove()"></div>
      <div class="wm">Flow<span class="s">Smartly</span></div>
    </div>
    <div class="brandchip">◑ <b id="brandName">Acme Coffee Co.</b> ▾</div>
    <div class="spacer"></div>
    <div class="credits">⚡ <b>1,240</b> <span class="t-muted" id="lblCredits">credits</span></div>
    <!-- language -->
    <div class="iconbtn" id="langBtn" title="Language" onclick="toggleLang(event)">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
      <div class="menu" id="langMenu"></div>
    </div>
    <!-- theme -->
    <div class="iconbtn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">
      <svg class="i" id="themeIcon" viewBox="0 0 24 24"></svg>
    </div>
    <div class="avatar">JY</div>
  </div>

  <!-- WORKSPACE RAIL -->
  <nav class="rail" id="rail"></nav>

  <!-- MAIN -->
  <main class="main">
    <div class="convo" id="convo">
      <section class="hero" id="hero">

const CHIP_IC=['palette','megaphone','video','bag'];
const SEED_IC=['palette','trending','video','bag'];

let lang='en';
function t(){return T[lang]||T.en;}

/* ===== render chrome ===== */
function renderRail(){
  const r=document.getElementById('rail');
  r.innerHTML=WS_KEYS.map((k,i)=>`
    <div class="item ${k==='Home'?'active':''}" data-ws="${k}">${svg(WS_ICON[k])}<span>${t().ws[k]}</span></div>
    ${k==='Home'||k==='Outreach'?'<div class="sep"></div>':''}`).join('');
}
function renderHome(){
  const x=t();
  document.documentElement.lang=lang;
  const rtl=RTL.includes(lang);
  document.body.classList.toggle('rtl',rtl);
  document.documentElement.dir=rtl?'rtl':'ltr';
  document.getElementById('h_greet').textContent=x.greet;
  document.getElementById('h_accent').textContent=x.accent;
  document.getElementById('h_sub').textContent=x.sub;
  document.getElementById('ta').placeholder=x.ph;
  document.getElementById('lblCredits').textContent=x.credits;
  document.getElementById('hint').innerHTML=x.hint;
  document.getElementById('chips').innerHTML=x.chips.map((c,i)=>`<div class="chip" onclick="run(this.dataset.q)" data-q="${c}">${svg(CHIP_IC[i])} ${c}</div>`).join('');
  const seedT=[['Design something','On-brand post, flyer, or ad — editable right in the chat.'],
    ['Plan my week','A full content calendar, scheduled across your channels.'],
    ['Make a video','Multi-scene ad with a flow you can tweak scene-by-scene.'],
    ['Build a store','Domain, storefront, products — assembled end to end.']];
  document.getElementById('seeds').innerHTML=seedT.map((s,i)=>`
    <div class="seed" onclick="run(this.dataset.q)" data-q="${x.chips[i]}">
      <div class="ic">${svg(SEED_IC[i])}</div><div class="t">${s[0]}</div><div class="d">${s[1]}</div></div>`).join('');
  renderRail();
}
function renderLangMenu(){
  document.getElementById('langMenu').innerHTML=LANGS.map(l=>`
    <div class="mi ${l.tag===lang?'on':''}" onclick="setLang('${l.tag}',event)">${l.native}<span class="code">${l.tag}</span></div>`).join('');
}
function setLang(tag,e){if(e)e.stopPropagation();lang=tag;renderHome();renderLangMenu();document.getElementById('langMenu').classList.remove('open');toast('Language: '+(LANGS.find(l=>l.tag===tag)||{}).native+' — UI + all AI output');}
function toggleLang(e){e.stopPropagation();document.getElementById('langMenu').classList.toggle('open');}
document.addEventListener('click',()=>document.getElementById('langMenu').classList.remove('open'));

/* ===== theme ===== */
function setThemeIcon(){document.getElementById('themeIcon').innerHTML=document.documentElement.classList.contains('dark')?IC.sun:IC.moon;}
function toggleTheme(){document.documentElement.classList.toggle('dark');setThemeIcon();toast(document.documentElement.classList.contains('dark')?'Dark theme':'Light theme');}

/* ===== helpers ===== */
const convo=document.getElementById('convo');
function toast(t){const n=document.getElementById('note');n.textContent=t;n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),1900);}
function scrollDown(){convo.scrollTo({top:convo.scrollHeight,behavior:'smooth'});}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
const ta=document.getElementById('ta');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFromBox();}});
function sendFromBox(){const v=ta.value.trim();if(!v)return;ta.value='';ta.style.height='auto';run(v);}

const SPINNER=`<svg class="fs-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="hsl(var(--muted-foreground))" stroke-width="2.5" stroke-opacity=".25"/><circle cx="12" cy="12" r="10" stroke="url(#sg)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="63" stroke-dashoffset="44"/><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs></svg>`;

/* ===== conversation ===== */
function userMsg(text){convo.appendChild(el(`<div class="msg user fade"><div class="who">JY</div><div class="body"><div class="bubble">${text}</div></div></div>`));scrollDown();}
function aiShell(){const m=el(`<div class="msg ai fade"><div class="who"><img src="../public/icon.png" onerror="this.parentNode.style.background='var(--grad)';this.remove()"></div><div class="body"></div></div>`);convo.appendChild(m);scrollDown();return m.querySelector('.body');}

function run(text){
  document.getElementById('hero').style.display='none';
  userMsg(text);
  const body=aiShell();
  const think=el(`<div class="think">${SPINNER} Thinking — reading your brand kit & choosing a layout…</div>`);
  body.appendChild(think);scrollDown();
  setTimeout(()=>{
    think.innerHTML='💭 Thought for 2s · matched <b>Acme Coffee Co.</b> brand kit ▾';
    body.appendChild(el(`<div class="aitext">Here's a <b>World Cup 2026</b> promo on your brand. I kept the copy short so it renders clean. Edit any text or the accent on the right — it updates live. When you like it, I'll schedule it.</div>`));
    body.appendChild(canvasCard());
    body.appendChild(flowCard());
    body.appendChild(planCard());
    scrollDown();
  },1100);
}

function canvasCard(){
  const c=el(`
  <div class="card fade">
    <div class="hd">${svg('palette')} Editable design · Instagram 1080×1080 <span class="tag">live · update_block</span></div>
    <div class="bd" style="padding:0">
      <div class="canvas-wrap">
        <div class="stage">
          <div class="poster" id="poster">
            <div class="pbg"></div>
            <div class="pin">

              <div class="ph" id="p_head">Game Day,<br>Brewed Right</div>
              <div class="psub" id="p_sub">Free pastry with any large coffee during every match.</div>
              <div class="pcta" id="p_cta">Order ahead →</div>
              <div class="pfoot"><span>acmecoffee.co</span><span>·</span><span>@acmecoffee</span></div>
            </div>
          </div>
        </div>
        <div class="editor">
          <div class="tabs"><div class="tb on">Content</div><div class="tb">Style</div></div>
          <div class="field"><label>Headline</label><input id="i_head" value="Game Day, Brewed Right"></div>
          <div class="field"><label>Subhead</label><input id="i_sub" value="Free pastry with any large coffee during every match."></div>
          <div class="field"><label>Call to action</label><input id="i_cta" value="Order ahead →"></div>
          <label style="font-size:11px;color:hsl(var(--muted-foreground));display:block;margin-bottom:5px">Accent</label>
          <div class="swatches" id="sw">
            <div class="sw on" style="background:#0ea5e9" data-c="#0ea5e9"></div>
            <div class="sw" style="background:#8b5cf6" data-c="#8b5cf6"></div>
            <div class="sw" style="background:#eccb93" data-c="#eccb93"></div>
            <div class="sw" style="background:#ec4899" data-c="#ec4899"></div>
          </div>
          <div class="mini">Text edits apply instantly. "Regenerate art" re-renders the visual while keeping your text exact.</div>
          <button class="btn" style="width:100%;justify-content:center" onclick="regen(this)">↻ Regenerate art</button>
        </div>
      </div>
    </div>
  </div>`);
  setTimeout(()=>{
    bind('i_head','p_head');bind('i_sub','p_sub');bind('i_cta','p_cta');
    c.querySelectorAll('#sw .sw').forEach(s=>s.addEventListener('click',()=>{
      c.querySelectorAll('#sw .sw').forEach(x=>x.classList.remove('on'));s.classList.add('on');
      document.getElementById('poster').style.setProperty('--acc',s.dataset.c);}));
    c.querySelectorAll('.tabs .tb').forEach(tb=>tb.addEventListener('click',()=>{c.querySelectorAll('.tabs .tb').forEach(x=>x.classList.remove('on'));tb.classList.add('on');}));
  },0);
  return c;
}
function bind(i,o){const a=document.getElementById(i),b=document.getElementById(o);if(a&&b)a.addEventListener('input',()=>b.innerHTML=a.value.replace(/\n/g,'<br>'));}
function regen(btn){const p=document.getElementById('poster');const o=btn.innerHTML;btn.innerHTML=SPINNER+' Rendering…';p.style.filter='blur(4px) brightness(.85)';setTimeout(()=>{p.style.filter='';btn.innerHTML=o;toast('Re-rendered — your text kept exactly');},1300);}

    <div class="progress"><i id="pg"></i></div>
    <div class="aitext" id="pgtxt" style="font-size:13px;color:hsl(var(--muted-foreground))">${SPINNER} Scheduling to Instagram + Facebook…</div>`;
  setTimeout(()=>document.getElementById('pg').style.width='100%',60);
  setTimeout(()=>{document.getElementById('pgtxt').innerHTML='Done — live <b>Sat 9:00 AM</b> on 2 channels. <a href="#" style="color:hsl(var(--primary))">View in Publish ↗</a>';toast('Scheduled across 2 channels');},1500);
}

/* ===== workspace rail panel ===== */
const WS_DESC={
  Create:'Design studio, logos, video studio, cartoon maker, media library.',
  Publish:'Social accounts, posts, content calendar and scheduling.',
  Grow:'Content automation & strategy, email, SMS, WhatsApp, ad builder, story-ad campaigns.',
  Sell:'Store builder, products, orders, customers, delivery, pricing, storefronts.',
  Web:'Website builder, landing pages, and domains.',
  Outreach:'Contacts & lists, reviews / local SEO, pitch board & proposals, follow-ups, forms, events.',
  Business:'Brand kit, analytics, credits & billing, teams, referrals, settings, admin.'
};
const WS_FOLDS={
  Create:['Design','Logos','Video','Cartoon','Media'],Publish:['Accounts','Posts','Calendar'],
  Grow:['Automation','Email','SMS','WhatsApp','Ads','Story-Ad'],Sell:['Products','Orders','Customers','Delivery','Pricing'],
  Web:['Sites','Landing pages','Domains'],Outreach:['Contacts','Reviews/SEO','Pitch','Forms','Events'],
  Business:['Brand kit','Analytics','Billing','Teams','Referrals','Admin']};
document.getElementById('rail').addEventListener('click',e=>{
  const it=e.target.closest('.item');if(!it)return;
  document.querySelectorAll('.rail .item').forEach(x=>x.classList.remove('active'));it.classList.add('active');
  const key=it.dataset.ws;if(key==='Home'){closeWs();return;}
  document.getElementById('wsIcon').innerHTML=svg(WS_ICON[key]);
  document.getElementById('wsName').textContent=t().ws[key];
  document.getElementById('wsBody').innerHTML=`
    <p style="color:hsl(var(--foreground))">${WS_DESC[key]}</p>
    <div class="pillrow">${(WS_FOLDS[key]||[]).map(p=>`<span class="pill">${p}</span>`).join('')}</div>
    <p>Everything here is also an agent tool — say what you want and it renders in the chat, or work in the focused view.</p>
    <div class="row"><button class="btn primary" onclick="closeWs();run('Open ${key} and help me get started')">${svg('sparkles')} Ask the agent</button>
      <button class="btn ghost" onclick="toast('Opening focused ${key} view…')">Open focused view</button></div>`;
  document.getElementById('wspanel').classList.add('open');
});
function closeWs(){document.getElementById('wspanel').classList.remove('open');}

/* ===== boot ===== */
const TIPS=['Loading your workspace…','Syncing your brand kit…','Warming up the agent…'];
let ti=0;const tipEl=document.getElementById('bootTip');
const tipTimer=setInterval(()=>{ti=(ti+1)%TIPS.length;tipEl.textContent=TIPS[ti];},700);
setThemeIcon();renderLangMenu();renderHome();
setTimeout(()=>{clearInterval(tipTimer);document.getElementById('boot').classList.add('hide');},1500);
</script>
</body>
</html>
