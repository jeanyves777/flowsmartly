<title>Create hub — bento alignment fix</title>
<style>
  :root{
    --bg:#1b1d21; --card:#22262c; --card2:#1e2228; --border:#333a44; --border2:#3c4450;
    --fg:#e8ecf6; --muted:#9aa4b6; --muted2:#727d90; --brand:#7c6bff; --brand2:#a78bfa;
    --brandsoft:rgba(124,107,255,.16);
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#eef0f6; --card:#fff; --card2:#f6f7fb; --border:#e3e6ef; --border2:#d7dbe8;
      --fg:#161a24; --muted:#5b6478; --muted2:#8b93a6; --brandsoft:rgba(124,107,255,.10); }
  }
  :root[data-theme="dark"]{ --bg:#1b1d21; --card:#22262c; --card2:#1e2228; --border:#333a44; --border2:#3c4450; --fg:#e8ecf6; --muted:#9aa4b6; --muted2:#727d90; --brandsoft:rgba(124,107,255,.16); }
  :root[data-theme="light"]{ --bg:#eef0f6; --card:#fff; --card2:#f6f7fb; --border:#e3e6ef; --border2:#d7dbe8; --fg:#161a24; --muted:#5b6478; --muted2:#8b93a6; --brandsoft:rgba(124,107,255,.10); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 3px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar button{border:1px solid var(--border);background:var(--card);color:var(--muted);
    border-radius:9px;font:inherit;font-size:12px;padding:6px 11px;cursor:pointer}
  .toolbar button.on{border-color:var(--brand);color:var(--brand2);background:var(--brandsoft)}

  .hint{color:var(--muted);font-size:13px;margin:0 0 16px}

  /* THE BENTO GRID (mirrors the React fix) */
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);
    border-radius:16px;background:var(--card);text-align:left;cursor:pointer;transition:.16s}
  .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 50%,var(--border));
    box-shadow:0 24px 50px -26px rgba(0,0,0,.7)}
  @media(min-width:1000px){ .card.hero{grid-column:span 2;grid-row:span 2} }
  @media(min-width:640px) and (max-width:999px){ .card.hero{grid-column:span 2} }

  .thumb{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden}
  .card.hero .thumb{aspect-ratio:auto;flex:1;min-height:200px}
  .thumb .fill{position:absolute;inset:0}

  .video{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#000}
  .video>div{background-size:cover;background-position:center}
  .v1{background:linear-gradient(120deg,#0b1830,#14204a);position:relative}
  .v1::after{content:"";position:absolute;inset:0;background:
    radial-gradient(60px 60px at 30% 40%,rgba(244,63,94,.5),transparent),
    radial-gradient(90px 90px at 70% 70%,rgba(56,189,248,.4),transparent)}
  .v2{background:linear-gradient(160deg,#14301c,#1d4a2c)}
  .play{position:absolute;inset:0;display:grid;place-items:center}
  .play span{width:46px;height:46px;border-radius:999px;background:rgba(255,255,255,.92);
    color:#6d28d9;display:grid;place-items:center;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.4);padding-left:3px}

  .grad{position:absolute;inset:0;display:grid;place-items:center}
  .grad svg{width:38px;height:38px;color:rgba(255,255,255,.85);stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .g0{background:linear-gradient(150deg,#0e2a4a,#3a1250)} .g1{background:linear-gradient(135deg,#12224a,#1e1150)}
  .g2{background:linear-gradient(135deg,#0b1a3a,#241243)} .g3{background:linear-gradient(135deg,#0c1a2e,#2a1440)}
  .designthumb{position:absolute;inset:0;background:linear-gradient(135deg,#0f1c3a,#2a1250)}
  .designthumb .doc{position:absolute;inset:14% 30%;border-radius:10px;
    background:linear-gradient(180deg,#7c6bff,#a78bfa);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px;box-shadow:0 14px 30px rgba(0,0,0,.4)}
  .designthumb .doc i{height:8px;border-radius:4px;background:rgba(255,255,255,.95)}
  .designthumb .doc i.s{width:60%;height:6px;background:rgba(255,255,255,.6)}
  .designthumb .doc i.b{width:40%;height:14px;background:#fbbf24}
  .logothumb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#0b1a3a,#12143a)}
  .logothumb i{width:34px;height:34px}.logothumb .a{border-radius:10px;background:linear-gradient(135deg,#7c6bff,#a78bfa)}
  .logothumb .b{border-radius:999px;background:linear-gradient(135deg,#f59e0b,#f43f5e)}
  .logothumb .c{background:linear-gradient(135deg,#10b981,#16a34a);clip-path:polygon(50% 0,100% 100%,0 100%)}
  .mediathumb{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#0c1220;padding:9px}
  .mediathumb span{border-radius:4px}
  .voicethumb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,#0b1630,#241243)}
  .voicethumb i{width:4px;border-radius:3px;background:linear-gradient(180deg,#7c6bff,#a78bfa)}

  .body{display:flex;flex-direction:column;gap:6px;padding:15px}
  .card:not(.hero) .body{flex:1}
  .body .top{display:flex;align-items:center;gap:8px}
  .body .top b{font-size:15px}
  .body .top .chev{margin-left:auto;color:var(--muted2)}
  .body p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tags span{border:1px solid var(--border);background:color-mix(in srgb,var(--muted) 12%,transparent);
    color:var(--muted);border-radius:999px;font-size:10px;font-weight:700;padding:2px 8px}
  .printlink{margin-top:2px;color:var(--brand2);font-size:11px;font-weight:700}
  .ask{margin-top:22px;display:flex;justify-content:center}
  .ask button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;
    background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;font:inherit;font-size:13px;font-weight:700;padding:10px 18px;cursor:pointer;box-shadow:0 14px 30px -12px rgba(124,107,255,.6)}
  .themebtn{position:fixed;top:14px;right:16px;border:1px solid var(--border);background:var(--card);
    color:var(--muted);border-radius:9px;font:inherit;font-size:11.5px;padding:6px 10px;cursor:pointer}
</style>

<button class="themebtn" onclick="const r=document.documentElement;r.dataset.theme=(r.dataset.theme==='light'?'dark':'light')">◑ theme</button>

<div class="wrap">
  <h1>Create hub — aligned</h1>
  <p class="sub">The Video hero now spans 2 columns <b>and 2 rows</b>; Design + Logo stack to its right and fill the height — the dead space is gone. Cards stretch so bottoms line up.</p>

  <div class="toolbar">
    <span style="font-size:12px;color:var(--muted)">Preview:</span>
    <button class="on" data-h="create" onclick="setHub('create')">Create (5)</button>
    <button data-h="publish" onclick="setHub('publish')">Publish (4)</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="ask"><button>✦ Ask the agent</button></div>
</div>

<script>
  const box = k => `<div class="grad ${k}"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg></div>`;
  const HUBS = {
    create: [
      {hero:1,label:"Video Studio",desc:"Direct a full film — AI shots, avatar & reel clips — into one movie.",tags:["AI film","Reel clips","Avatar"],thumb:`<div class="video"><div class="v1"></div><div class="v2"></div></div><div class="play"><span>▶</span></div>`},
      {label:"Design Studio",desc:"Graphics, posts, ads & print — one canvas for screen and print-ready output.",tags:["Graphics & ads","Print"],print:1,thumb:`<div class="designthumb"><div class="doc"><i></i><i class="s"></i><i class="b"></i></div></div>`},
      {label:"Logo Generator",desc:"Generate, refine & export a logo system for your brand.",thumb:`<div class="logothumb"><i class="a"></i><i class="b"></i><i class="c"></i></div>`},
      {label:"Voice Studio",desc:"AI voiceovers, narration & voice cloning.",thumb:`<div class="voicethumb"><i style="height:16px"></i><i style="height:30px"></i><i style="height:44px"></i><i style="height:26px"></i><i style="height:38px"></i><i style="height:22px"></i><i style="height:34px"></i></div>`},
      {label:"Media Library",desc:"Every image & video you've made, in one place.",thumb:`<div class="mediathumb"><span style="background:linear-gradient(135deg,#0ea5e9,#6366f1)"></span><span style="background:linear-gradient(135deg,#f59e0b,#f43f5e)"></span><span style="background:linear-gradient(135deg,#10b981,#047857)"></span><span style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"></span><span style="background:linear-gradient(135deg,#f43f5e,#f59e0b)"></span><span style="background:linear-gradient(135deg,#06b6d4,#3b82f6)"></span><span style="background:linear-gradient(135deg,#84cc16,#16a34a)"></span><span style="background:linear-gradient(135deg,#a855f7,#6366f1)"></span></div>`},
    ],
    publish: [
      {hero:1,label:"Content Campaign",desc:"Plan & auto-generate a batch of scheduled posts — review, tweak & approve.",tags:["New campaign","Library"],thumb:box("g0")},
      {label:"Compose a post",desc:"Write & schedule a single post across your channels.",thumb:box("g1")},
      {label:"Content Calendar",desc:"See what's scheduled, published & pending.",thumb:box("g2")},
      {label:"Posts & scheduled",desc:"Draft, schedule & track individual posts.",thumb:box("g3")},
    ],
  };
  function setHub(h){
    document.querySelectorAll('.toolbar button').forEach(b=>b.classList.toggle('on',b.dataset.h===h));
    document.getElementById('grid').innerHTML = HUBS[h].map(it=>`
      <div class="card ${it.hero?'hero':''}">
        <div class="thumb">${it.thumb}</div>
        <div class="body">
          <div class="top"><b>${it.label}</b><span class="chev">›</span></div>
          <p>${it.desc}</p>
          ${it.tags?`<div class="tags">${it.tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}
          ${it.print?`<div class="printlink">Print formats →</div>`:''}
        </div>
      </div>`).join('');
  }
  setHub('create');
</script>
