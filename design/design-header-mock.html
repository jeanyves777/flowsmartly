<!doctype html><meta charset=utf8><style>
  :root{--bg:#0b1120;--card:#0f1729;--border:#26324a;--muted:#8b96a8;--fg:#e6ebf3;--brand:#6d5cff;--violet:#8b5cf6}
  *{box-sizing:border-box}body{margin:0;background:#0a0f1c;font:13px -apple-system,Segoe UI,sans-serif;color:var(--fg)}
  .wrap{width:1240px;margin:20px auto;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg)}
  /* FocusedView workspace header */
  .hdr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:#0f1729aa;padding:10px 16px}
  .ico{display:grid;place-items:center;height:32px;width:32px;border-radius:9px;background:linear-gradient(135deg,#6d5cff33,#8b5cf626);color:#a78bfa;flex:0 0 auto}
  .ttl{min-width:0}.ttl b{display:block;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  /* fv-header-slot: single non-wrapping cluster */
  .slot{display:flex;align-items:center;gap:6px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--fg);background:transparent;white-space:nowrap;flex:0 0 auto}
  .btn.icon{padding:0;height:32px;width:32px;justify-content:center}
  .btn.muted{color:var(--muted)}
  .div{margin:0 2px;height:20px;width:1px;background:var(--border);flex:0 0 auto}
  .name{border:1px solid transparent;background:transparent;color:var(--fg);font-weight:600;font-size:12.5px;padding:4px 6px;border-radius:6px;max-width:130px;min-width:0}
  .export{background:linear-gradient(90deg,var(--brand),var(--violet));border:0;font-weight:700;color:#fff}
  .exit{border:1px solid var(--border);color:var(--muted)}
  svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .body{height:120px;background:repeating-linear-gradient(0deg,#0d1424,#0d1424 22px,#0f1830 22px,#0f1830 23px)}
  h3{color:#a78bfa;font-size:13px;margin:22px auto 8px;width:1240px}
</style>
<h3>Design Studio header — reorganized single row (at 1240px, your width)</h3>
<div class="wrap">
  <div class="hdr">
    <span class="ico"><svg><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1-.3-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.9-4.5-9-10-9z"/></svg></span>
    <div class="ttl"><b>Create</b><small>Design canvas</small></div>
    <div class="right">
      <div class="slot">
        <button class="btn icon muted"><svg><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg></button>
        <button class="btn icon muted"><svg><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg></button>
        <span class="div"></span>
        <button class="btn"><svg><path d="M12 5v14M5 12h14"/></svg> Text</button>
        <button class="btn"><svg><path d="M4 20h16M4 4h7l2 3h7v11a2 2 0 0 1-2 2"/></svg> Designs</button>
        <input class="name" value="Untitled design">
        <span class="div"></span>
        <button class="btn"><svg><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Save</button>
        <button class="btn export"><svg><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Export</button>
        <button class="btn icon"><svg><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></button>
      </div>
      <button class="btn exit"><svg><path d="M18 6 6 18M6 6l12 12"/></svg> Exit</button>
    </div>
  </div>
  <div class="body"></div>
</div>
