# =============================================================================
# flowsmartly.com — the apex, V5 only
# =============================================================================
#
# ⭐ **The cutover.** This replaces a vhost that proxied ELEVEN location blocks to
# `v4_app` (127.0.0.1:3001) — `/api/`, `/api/v1/`, `/_next/`, `/teams/`,
# `/admin`, the reset/verify/forgot handlers, a ~50-name signed-in product regex
# containing `home`, `dashboard`, `studio` and `settings`, the published-link
# namespace, `/marketing-compliance`, and an `@v4_static` fallback.
#
# **There is no `v4_app` in this file, and no `proxy_pass` of any kind.** An apex
# request is served from one of two static roots or it is a V5 404. Nothing can
# fall through to V4 because there is nothing to fall through to.
#
# ## Two roots, and why the marketing one stays
#
#   /var/www/flowsmartly-v5/current       the public marketing site (default root)
#   /var/www/flowagent-portal/current     the V5 product portal
#
# Both are V5 static exports. The ruling required the apex to be V5 with no V4
# fallthrough; it did not require deleting the public marketing pages, and
# `/product`, `/pricing`, `/legal/*` and the rest are not V4 — they are served
# from a static export today and are served from the same one after this. Taking
# them out would be an unrequested destruction, so they stay and the portal takes
# the product and auth namespace.
#
# ## Where the two namespaces overlap
#
# Measured, not assumed. The exports collide on exactly four names:
#
#   /login       → PORTAL. The ruling requires it: this is the screen that must
#                  render Turnstile and reach the V5 API.
#   /flowagent   → PORTAL. It is a product surface, and the ruling says product
#                  routes are V5's.
#   /            → marketing. What a visitor sees today, unchanged.
#   /+not-found  → PORTAL, so an unknown apex route is V5's own 404.
#
# ⚠️ The marketing export's own `/login` and `/flowagent` pages become
# unreachable. That is the intended consequence of the first two lines above and
# is stated here so it is not discovered later.
#
# ⚠️ nginx 1.24.0 — `listen 443 ssl http2;`, never `http2 on;`.

server {
    listen 80;
    listen [::]:80;
    server_name flowsmartly.com www.flowsmartly.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://flowsmartly.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flowsmartly.com;

    ssl_certificate     /etc/letsencrypt/live/flowsmartly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowsmartly.com/privkey.pem;

    return 301 https://flowsmartly.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flowsmartly.com;

    ssl_certificate     /etc/letsencrypt/live/flowsmartly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowsmartly.com/privkey.pem;

    # The marketing export is the default root; the portal is named explicitly
    # by the locations that belong to it.
    root /var/www/flowsmartly-v5/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # A static site takes no bodies. 16k is generous for a form post and refuses
    # anything that is not one.
    client_max_body_size 16k;

    # ⭐ An unknown route answers with the 404 of the SITE it was addressed to.
    #
    # ⚠️ This block sent every miss to the portal's not-found, on the reasoning
    # that "an unknown apex route is the PORTAL's 404 — V5's own". That is right
    # for a product path and wrong for a public one: a visitor who mistypes a
    # marketing URL was shown a bare page telling them to "go to your workspace",
    # with no header, no navigation and no way back into the site — about a
    # workspace they may not have. Meanwhile the designed public 404 was built
    # and deployed to the marketing root and reachable by nothing.
    #
    # ⚠️ No `=` before the handler. `error_page 404 = @handler` replaces the
    # status with whatever the handler returns — which for a file that exists is
    # **200**, so every unknown route would answer "OK" while rendering a
    # not-found page. Measured: /definitely-not-a-route returned 200 until this
    # was corrected. Without the `=`, the 404 is preserved and the body is ours.
    error_page 404 @public_not_found;

    # The default: anything not claimed by a portal location below is public.
    location @public_not_found {
        root /var/www/flowsmartly-v5/current;
        try_files /+not-found.html =404;
        internal;
    }

    # ⭐ **One not-found page for the whole system**, public and product alike.
    #
    # This was rooted in the portal, which gave a mistyped product URL the bare
    # "go to your workspace" page — no header, no navigation, no way back. The
    # owner's decision is that the designed page is the page, everywhere.
    #
    # ⚠️ Interim, and named so nobody mistakes it for the finished state: the
    # designed page carries the PUBLIC header — "Log in", "Join early access" —
    # which is wrong to show someone already signed in. The portal owes a
    # signed-in variant of this same design; when it exists, this root moves back
    # to the portal and the two stay identical apart from the header.
    location @v5_not_found {
        root /var/www/flowsmartly-v5/current;
        try_files /+not-found.html =404;
        internal;
    }

    # -----------------------------------------------------------------------
    # The V5 portal — product and authentication
    # -----------------------------------------------------------------------
    #
    # Listed by name rather than caught by a wildcard, because a wildcard here
    # would silently take any route the marketing site later adds. Adding a
    # portal route means adding it here, which is the review this deserves.
    # ⚠️ `auth` is here for ONE route: /auth/callback, the URL Google and
    # Microsoft are configured to redirect a completed sign-in to. It must be on
    # the apex — the session credential is a host-only `__Host-` cookie, so a
    # handshake returning to any other host loops forever — and it must be named
    # here, because this vhost is deny-by-default and an unlisted path falls
    # through to the marketing root and answers 404. The provider-side value is
    # OIDC_REDIRECT_URI and is entered by hand in two external consoles;
    # apps/portal/app/(public)/auth/callback.tsx carries the full note.
    location ~ ^/(accept-invitation|activity|approvals|auth|connections|flowagent|forgot|home|listsmartly|login|onboarding|register|reset|verify)(/|$) {
        root /var/www/flowagent-portal/current;
        # `=404` rather than `/+not-found.html`: a try_files file fallback is
        # served with **200**, which is the defect the header above this block
        # records — and it was still live here. The `=404` raises a real 404 and
        # `error_page` below dresses it in the portal's page.
        error_page 404 @v5_not_found;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ ^/(admin|ads|agents|ai-studio|analytics|email-sms|flowlearner|flowshop|leads|proposals|settings|sites|social)(/|$) {
        root /var/www/flowagent-portal/current;
        # `=404` rather than `/+not-found.html`: a try_files file fallback is
        # served with **200**, which is the defect the header above this block
        # records — and it was still live here. The `=404` raises a real 404 and
        # `error_page` below dresses it in the portal's page.
        error_page 404 @v5_not_found;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # -----------------------------------------------------------------------
    # Shared asset prefixes — the portal first, then marketing
    # -----------------------------------------------------------------------
    #
    # Both are Expo exports, so both publish `/_expo/` and `/assets/`. The names
    # are content-hashed, so there is no real collision; this simply tries one
    # root and then the other rather than guessing which export a hash came from.
    location ^~ /_expo/ {
        root /var/www/flowagent-portal/current;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri @marketing_assets;
    }

    location ^~ /assets/ {
        root /var/www/flowagent-portal/current;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri @marketing_assets;
    }

    location @marketing_assets {
        root /var/www/flowsmartly-v5/current;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # The public marketing site — unchanged
    # -----------------------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(product|pricing|early-access|flow-ai|solutions|platform|resources|company|legal|education)(/|$) {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The legal short forms the marketing site has always redirected.
    location = /privacy   { return 301 /legal/privacy$is_args$args; }
    location = /terms     { return 301 /legal/terms$is_args$args; }
    location = /sms-terms { return 301 /legal/sms-terms$is_args$args; }
    location = /gdpr      { return 301 /legal/gdpr$is_args$args; }

    # Root-level files the marketing export publishes.
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /llms.txt    { try_files $uri =404; }
    location = /ai.txt      { try_files $uri =404; }
    location = /feed.xml    { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; access_log off; }

    location ~* ^/[^/]+\.(webmanifest|json|png|ico|svg|jpg|jpeg|webp|gif|txt|xml|woff2?|map)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Everything else
    # -----------------------------------------------------------------------
    #
    # 🛑 No `@v4_static`, no `proxy_pass`, no fallback of any kind. An unmatched
    # path reaches here, finds no file, and becomes the V5 404 above.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
