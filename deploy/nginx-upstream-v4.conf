# Shared V4 upstream — flowsmartly.com AND legacy.flowsmartly.com
# ================================================================
#
# Both vhosts proxy to the same V4 process, so the upstream lives in its own
# file rather than inside either one of them.
#
# This is not tidiness. It is the rollback path.
#
# The apex config used to declare it, and the legacy config used it. That means
# disabling or replacing the apex vhost — which is exactly what rollback lever 2
# in deploy/CUTOVER-CHECKLIST.md does — left `upstream v4_app` undefined for the
# legacy vhost. `nginx -t` then fails, the reload is refused, and the legacy host
# goes down with it. The legacy host is the only way an existing customer can
# reach their workspace during a rollback, so it must not depend on the config
# being rolled back.
#
# Install as /etc/nginx/conf.d/upstream-v4.conf, which is included from http{}
# before sites-enabled. Do NOT put it in sites-available.

upstream v4_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limits for the V5 API namespace on the apex. They must live in http{},
# and they are here for the same reason the upstream is: nothing that both
# vhosts or the reload depends on should sit inside a config we may disable.
limit_req_zone $binary_remote_addr zone=v5_api:10m rate=10r/m;

# /api/v1/leads is the only unauthenticated WRITE surface on the apex, so it gets
# its own, tighter bucket. Sharing v5_api would let read traffic spend the budget
# that has to be there for a real person submitting a form.
limit_req_zone $binary_remote_addr zone=v5_leads:10m rate=6r/m;
