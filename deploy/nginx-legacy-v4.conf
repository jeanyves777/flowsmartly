# legacy.flowsmartly.com — the existing V4 application
# ====================================================
#
# Continuity only. This host serves the V4 app exactly as flowsmartly.com served
# it before the cutover: login, dashboard, settings, billing, integrations, all
# 42 authenticated route segments and the V4 API. Nothing here is redesigned or
# migrated as part of the public cutover.
#
# Companion config: deploy/nginx-flowsmartly-v5.conf (apex -> V5 static).
#
# Sessions
# --------
# V4 sets auth cookies with no Domain attribute (src/lib/auth/session.ts:13-18),
# so they are host-only. Cookies issued here are scoped to
# legacy.flowsmartly.com and are never sent to the apex. That is the intended
# isolation and it must NOT be "fixed" by adding Domain=.flowsmartly.com.
#
# The cost, accepted deliberately: cookies issued earlier for host
# flowsmartly.com are not sent here, so every existing customer signs in once
# more after the cutover. The customer email must say so. No cross-host session
# migration is attempted.
#
# Prerequisites (see deploy/CUTOVER-CHECKLIST.md)
#   - deploy/nginx-upstream-v4.conf installed as /etc/nginx/conf.d/upstream-v4.conf.
#     It declares `upstream v4_app`, which this file proxies to. It is a separate
#     file precisely so that disabling the apex vhost during a rollback cannot
#     take the legacy host down with it — this host is the only way an existing
#     customer reaches their workspace while a rollback is in progress.
#   - DNS A record for legacy.flowsmartly.com -> 187.77.29.88 (Hostinger zone)
#   - certbot certificate covering legacy.flowsmartly.com
#
# NOT a prerequisite — the one change this cutover must never make
# ----------------------------------------------------------------
# Do NOT set APP_URL / NEXT_PUBLIC_APP_URL to https://legacy.flowsmartly.com.
#
# The original cutover plan listed exactly that as a prerequisite of this
# file, which is why the line was here. It is wrong, and section 0 of
# deploy/CUTOVER-CHECKLIST.md overrules it. The instruction is kept and
# inverted rather than deleted: whoever wrote it had reasoned their way to
# it, and a silent deletion invites the next person to reason their way back.
#
# Why it is wrong: this vhost and the apex proxy the SAME single V4 process.
# There is one value of that variable, not one per host, so there is no
# per-host setting to give it here. 26 files build OAuth redirect_uri values
# from it — Meta, Google, LinkedIn, Pinterest, TikTok, X, YouTube, Google
# Business, WhatsApp — and every provider rejects a redirect_uri it does not
# have on file. Re-registering all 26 means multi-day app review at several
# of them, with every customer social connection broken until it clears.
#
# Why it is unnecessary: the apex keeps proxying /api/* to V4, so those
# callbacks stay valid at https://flowsmartly.com; and the human links the
# variable builds (/verify-email, /reset-password, /teams/invite/<token>)
# are 301d to this host with the query string intact. Leave it at
# https://flowsmartly.com. scripts/precheck-v5-routes.mjs fails if any config
# in deploy/ names the variable on a line that does not forbid the change.

server {
    listen 80;
    listen [::]:80;
    server_name legacy.flowsmartly.com;
    return 301 https://legacy.flowsmartly.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name legacy.flowsmartly.com;

    # certbot --nginx -d legacy.flowsmartly.com
    # ssl_certificate     /etc/letsencrypt/live/legacy.flowsmartly.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/legacy.flowsmartly.com/privkey.pem;

    # This is a legacy continuity environment, not a marketing surface. Keep it
    # out of the index entirely so it cannot compete with the V5 site for the
    # brand's search results or split canonical authority.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    client_max_body_size 100m;

    location / {
        proxy_pass         http://v4_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Long-running generation endpoints (video, image, agent runs).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Same branded fallback the apex uses when the app upstream is down.
        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
        root /var/www/flowsmartly-maintenance;
        rewrite ^.*$ /maintenance.html break;
        add_header Retry-After   "1800"     always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }
}
