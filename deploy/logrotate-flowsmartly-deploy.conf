# /etc/logrotate.d/flowsmartly-deploy
#
# The deploy log is the operator's primary evidence of what production is
# running and why. It was at 50 MB and unrotated as of 2026-08-11, which makes it
# slow to read and eventually unwritable — i.e. it threatens the very signal the
# deploy pipeline depends on.
#
# copytruncate, not create: poll-deploy.sh and deploy-vps.sh append with `>>` to a
# path they hold open for the length of a deploy, so rotating out from under a
# running deploy must not lose its output.
#
# Install (one-time, on the VPS):
#   cp /opt/flowsmartly/deploy/logrotate-flowsmartly-deploy.conf \
#      /etc/logrotate.d/flowsmartly-deploy
#   logrotate -d /etc/logrotate.d/flowsmartly-deploy   # dry run
/var/log/flowsmartly-deploy.log {
    weekly
    rotate 8
    size 20M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
