# Branded maintenance fallback for flowsmartly.com
# =================================================
#
# Goal: when the Next app on 127.0.0.1:3000 can't respond (crash, OOM during the
# build, or the brief window during a deploy), serve a branded "We'll be right back"
# page instead of Nginx's raw 502/504 white error page.
#
# The page itself is shipped in the repo at public/maintenance.html and copied to
# /var/www/flowsmartly-maintenance/maintenance.html on every deploy by
# scripts/deploy-vps.sh — so it always matches the current branding. You only need
# to wire Nginx ONCE (below); after that it's automatic.
#
# --- ONE-TIME SETUP (run on the VPS as root) ---------------------------------
#
#   1) Make sure the page is present (the next deploy also does this):
#        mkdir -p /var/www/flowsmartly-maintenance
#        cp /opt/flowsmartly/public/maintenance.html /var/www/flowsmartly-maintenance/maintenance.html
#
#   2) Edit the flowsmartly.com server block (e.g. /etc/nginx/sites-available/flowsmartly):
#        - add the two lines marked  # ADD  inside your existing `location / { ... }`
#        - add the whole `location @maintenance { ... }` block alongside it
#
#   3) Test + reload:
#        nginx -t && systemctl reload nginx
#
#   4) (optional) verify: stop the app briefly and curl the site — you should get
#      the branded page, not a 502:
#        pm2 stop flowsmartly && curl -s -o /dev/null -w '%{http_code}\n' https://flowsmartly.com ; pm2 start flowsmartly
#
# -----------------------------------------------------------------------------

# Inside your existing `server { ... }` block for flowsmartly.com:

location / {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    proxy_intercept_errors on;                 # ADD: let Nginx handle upstream 5xx
    error_page 502 503 504 = @maintenance;     # ADD: ...by serving the branded page
}

# Branded page served when the app upstream is unreachable.
location @maintenance {
    root /var/www/flowsmartly-maintenance;
    rewrite ^.*$ /maintenance.html break;
    # Tell browsers/crawlers this is temporary (30 min) so the site isn't deindexed.
    add_header Retry-After  "1800"     always;
    add_header Cache-Control "no-store" always;
    default_type text/html;
}
