# flowsmartly.com — V5 public site (apex)
# =======================================
#
# The apex serves the V5 static export and keeps three families of V4 URLs alive.
# Route ownership is EXPLICIT: anything not claimed below returns V5's 404 page.
# Nothing falls through to V4 by accident, and no V5 route is created by accident.
#
# Companion config: deploy/nginx-legacy-v4.conf (legacy.flowsmartly.com -> V4).
# Authoritative table: deploy/ROUTE-OWNERSHIP.md.
#
# Why V4 keeps /api on the apex
# -----------------------------
# 21 callback/webhook URLs are registered in vendor consoles (Meta, Google,
# LinkedIn, Pinterest, TikTok, X, YouTube, Google Business, WhatsApp, Stripe,
# Telnyx) and 8 cron entries curl https://flowsmartly.com/api/cron/*. Moving
# /api would require re-registering every one of them, several behind multi-day
# app review. V4's namespace is unversioned (/api/<name>) and V5's is /api/v1/*,
# so both live on the apex without colliding and nothing has to be re-registered.
#
# Session isolation
# -----------------
# V4 auth cookies are host-only (no Domain attribute — src/lib/auth/session.ts).
# That is the isolation we want, so V4 routes that CREATE a session are
# redirected to the legacy host rather than proxied here. If they were proxied,
# V4 would set a session cookie on flowsmartly.com and the isolation would be
# lost. Routes that only SERVE public content are proxied, because their URLs
# are already published in customer emails, QR codes and print.

# REQUIRES deploy/nginx-upstream-v4.conf, installed as
# /etc/nginx/conf.d/upstream-v4.conf. It declares `upstream v4_app` and the two
# limit_req zones used below. They are deliberately NOT in this file: the legacy
# vhost proxies to the same upstream, and rollback lever 2 disables this config
# — the legacy host must not go down with it.

server {
    listen 80;
    listen [::]:80;
    server_name flowsmartly.com www.flowsmartly.com;
    return 301 https://flowsmartly.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flowsmartly.com;

    # EXPLICIT, not `certbot --nginx`. The nginx installer rewrites the vhost in
    # place, so the repository copy would stop being the copy that runs. And a
    # commented-out certificate here is not a harmless placeholder: `listen ... ssl`
    # with no certificate is a FATAL nginx error, so this file could not be enabled
    # at all - the apex flip would abort at nginx -t. Measured on the box.
    # This is the SAME certificate the V4 apex already serves; it covers
    # flowsmartly.com and www.flowsmartly.com, so the flip needs no new issuance.
    ssl_certificate     /etc/letsencrypt/live/flowsmartly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowsmartly.com/privkey.pem;

    return 301 https://flowsmartly.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flowsmartly.com;

    ssl_certificate     /etc/letsencrypt/live/flowsmartly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowsmartly.com/privkey.pem;

    # The symlink flipped by scripts/deploy-v5-public.sh. Never edit in place.
    root /var/www/flowsmartly-v5/current;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # V5's own 404 page for anything unclaimed.
    error_page 404 /+not-found.html;
    location = /+not-found.html { internal; }

    # ------------------------------------------------------------------
    # 0. Clean URLs — the `.html` form must never be SERVED
    # ------------------------------------------------------------------
    # `expo export` writes one file per route (`flowagent.html`) and section 7
    # maps the clean URL onto it. The inverse must NOT also work.
    #
    # The trap, documented at the top of scripts/qa-serve.mjs: expo-router reads
    # `location.pathname` when it hydrates. Served at the URL `/flowagent.html`
    # it sees a path matching no route and renders its not-found page — with a
    # 200 status, the full site chrome, and an appearance convincing enough that
    # an entire QA pass was captured against the wrong page before anyone
    # noticed. A 404 that screenshots as a real page is worse than a 404.
    #
    # So the `.html` form is 301'd to the clean URL before anything can serve
    # it. Placed FIRST deliberately: nginx tries regex locations in source order
    # and the first match wins, so no later rule may get the chance.
    #
    # Scoped to the V5 namespace instead of a bare `.html$`, because /sites/*
    # and /store/* are customer-generated V4 pages that may legitimately publish
    # a .html URL — rewriting one of those would break a published link.
    location = /index.html { return 301 /$is_args$args; }

    location ~ ^/((?:product|pricing|flowagent|flow-ai|early-access|login|solutions|platform|resources|company|legal|education)(?:/[A-Za-z0-9._~-]+)*).html$ {
        return 301 /$1$is_args$args;
    }

    # ------------------------------------------------------------------
    # 1. V5 API namespace
    # ------------------------------------------------------------------
    # TEMPORARY: no V5 backend is deployed yet, so /api/v1/* is served by the
    # V4 process, which implements the V5-native contract at src/app/api/v1/.
    # The V5 frontend knows only /api/v1/* and the V5 request/response shape —
    # it never sees a V4 endpoint name or envelope.
    #
    # TO CUT OVER to the real V5 API: change this one proxy_pass to the V5 API
    # upstream and delete src/app/api/v1/ from the V4 repo. No frontend change,
    # no redeploy of the static site.
    # TEMPORARY BRIDGE — POST /api/v1/leads
    # ---------------------------------------------------------------
    # /api/v1/leads is the V5 public lead-capture contract: early access,
    # contact, demo and partner submissions. There is no V5 backend deployed
    # yet, so the contract is implemented inside the V4 process at
    # src/app/api/v1/leads/route.ts. That file is a V5-shaped endpoint that
    # happens to run on V4's runtime — it is NOT a V4 endpoint being borrowed.
    #
    # The distinction is the entire point. The V5 frontend knows exactly one
    # path, /api/v1/leads, and one request/response shape. It never learns that
    # DemoRequest, Prisma or V4 exist. Retiring the bridge is therefore:
    #   1. implement the same contract in the V5 API,
    #   2. change the proxy_pass below to the V5 upstream,
    #   3. migrate DemoRequest where source LIKE 'v5-%',
    #   4. delete src/app/api/v1/ from the V4 repo.
    # ZERO frontend change and no static redeploy at any step.
    #
    # An exact-match location so it beats the ^~ /api/v1/ prefix below and can
    # carry limits the rest of the namespace must not have.
    location = /api/v1/leads {
        proxy_pass         http://v4_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # The only unauthenticated write surface on the apex. A form submission
        # is a few hundred bytes; anything larger is not a lead.
        limit_req            zone=v5_leads burst=5 nodelay;
        limit_req_status     429;
        client_max_body_size 16k;
        proxy_read_timeout   20s;
    }

    location ^~ /api/v1/ {
        proxy_pass         http://v4_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        limit_req zone=v5_api burst=20 nodelay;
    }

    # ------------------------------------------------------------------
    # 2. V4 API — unchanged, so no provider re-registration
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass         http://v4_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Webhook bodies (Stripe events, media payloads) can be large.
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    # ------------------------------------------------------------------
    # 3. Session-creating V4 routes -> legacy host (301, query preserved)
    # ------------------------------------------------------------------
    # $request_uri is the full original path AND query string, so the token in
    # an already-sent reset/verify/invitation email survives the hop intact.
    location ~ ^/(reset-password|verify-email|forgot-password)(/|$) {
        return 301 https://legacy.flowsmartly.com$request_uri;
    }

    # Team invitation acceptance — tokenised links already sent by email.
    location ^~ /teams/ {
        return 301 https://legacy.flowsmartly.com$request_uri;
    }

    # Admin portal and its own login.
    location ^~ /admin {
        return 301 https://legacy.flowsmartly.com$request_uri;
    }

    # ------------------------------------------------------------------
    # 4. Customer-generated public content — stays on the apex
    # ------------------------------------------------------------------
    # These URLs are printed on materials, embedded in QR codes and sent in
    # campaigns. They must not move. No authentication happens on any of them.
    location ~ ^/(p|store|sites|form|ad|m|t|ref|optin|survey|event|bp|pf|follow-up|ticket)(/|$) {
        proxy_pass         http://v4_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    # ------------------------------------------------------------------
    # 5. Legal pages moved under /legal/*
    # ------------------------------------------------------------------
    # Permanent: V5's legal pages are canonical. External registrations that
    # cite the old URLs (A2P 10DLC, carrier campaigns) still resolve while they
    # are updated out of band.
    location = /privacy   { return 301 /legal/privacy$is_args$args; }
    location = /terms     { return 301 /legal/terms$is_args$args; }
    location = /sms-terms { return 301 /legal/sms-terms$is_args$args; }
    location = /gdpr      { return 301 /legal/gdpr$is_args$args; }

    # No V5 counterpart exists for these two yet — keep serving V4's copies
    # rather than 404 a page that carriers and marketplaces may cite.
    location ~ ^/(marketing-compliance|ecommerce-terms)(/|$) {
        proxy_pass         http://v4_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ------------------------------------------------------------------
    # 6. Registration -> V5 early access
    # ------------------------------------------------------------------
    # 302, not 301: these become real V5 registration once V5 auth ships, and a
    # 301 would be cached in browsers long after that.
    #
    # $is_args$args is kept: these are the URLs paid and referral traffic lands
    # on, and dropping the query silently destroys the utm_* attribution for
    # exactly the visitors the early-access funnel exists to measure.
    location = /register     { return 302 /early-access$is_args$args; }
    location = /signup       { return 302 /early-access$is_args$args; }
    location = /get-started  { return 302 /early-access$is_args$args; }
    location = /start        { return 302 /early-access$is_args$args; }

    # V4 marketing page with a V5 equivalent.
    location = /book-demo { return 301 /company/contact?topic=demo; }

    # Flow.AI was renamed FlowAgent. The export ships a client-side stub at
    # /flow-ai/index.html carrying rel=canonical and noindex, but a stub cannot
    # consolidate ranking signals — apps/v5/scripts/agent-assets.js says exactly
    # that in its own comment and names this rule. 301 rather than 302 because
    # the canonical tag already shipping in that stub asserts permanence, and a
    # 302 here would contradict the HTML we are serving.
    #
    # Safe only because V4's authenticated /flow-ai now lives on the legacy
    # host. The V4 deploy health check is unaffected: scripts/deploy-vps.sh
    # checks http://127.0.0.1:3000/flow-ai, straight to the upstream, bypassing
    # Nginx entirely. Do not "simplify" that health check to use the apex — it
    # would then pass while the V4 app is dead.
    location = /flow-ai { return 301 /flowagent$is_args$args; }

    # ------------------------------------------------------------------
    # 7. V5 static — explicit ownership only
    # ------------------------------------------------------------------
    # `expo export` writes one file per route (product.html). try_files maps the
    # clean URL onto it, so scripts/mirror-routes.js is a local-QA tool only and
    # is deliberately NOT part of the deploy.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(product|pricing|flowagent|flow-ai|early-access|login|solutions|platform|resources|company|legal|education)(/|$) {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Content-hashed bundles — safe to cache hard.
    location ^~ /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # The self-hosted typeface.
    #
    # This vhost is DENY BY DEFAULT - `location /` returns 404, and every static
    # path is allowlisted above. A new asset directory in the export is
    # therefore invisible to production until it is named here, and it fails
    # SILENTLY: the @font-face request 404s, the browser falls back to the
    # platform stack, and the page still renders. The site shipped without its
    # typeface for exactly that reason, and no local check could have caught it
    # because the QA server has no allowlist.
    #
    # These filenames are stable rather than content-hashed, so the cache is a
    # week with revalidation instead of the year an immutable asset would take.
    location ^~ /fonts/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Single-file routes at the root.
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /llms.txt    { try_files $uri =404; }
    location = /ai.txt      { try_files $uri =404; }
    location = /feed.xml    { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; access_log off; }

    # ------------------------------------------------------------------
    # 8. Everything else is unowned -> V5 404 (never a silent V4 fallthrough)
    # ------------------------------------------------------------------
    location / {
        return 404;
    }

    location @maintenance {
        root /var/www/flowsmartly-maintenance;
        rewrite ^.*$ /maintenance.html break;
        add_header Retry-After   "1800"     always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }
}
