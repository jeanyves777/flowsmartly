# legacy.flowsmartly.com — HTTP-ONLY BOOTSTRAP
# ==============================================
#
# This exists for one reason: a certificate for legacy.flowsmartly.com cannot be
# issued until an HTTP-01 challenge can be answered on port 80 for that exact
# name, and the final vhost cannot be installed until the certificate exists.
# Installing deploy/nginx-legacy-v4.conf first fails `nginx -t` outright —
# `listen ... ssl` with an ssl_certificate path that is not on disk yet.
#
# So: this goes in first, certbot issues against it, then it is REPLACED by
# deploy/nginx-legacy-v4.conf. It is not a permanent part of the topology.
#
# While this is installed, legacy.flowsmartly.com is reachable over plain HTTP
# and still answers HTTPS from the catch-all vhost with the APEX certificate,
# i.e. a name mismatch. That window is why 4B runs as one operation rather than
# being left overnight: the DNS record is already public.
#
# Requires: deploy/nginx-upstream-v4.conf installed as
#           /etc/nginx/conf.d/upstream-v4.conf  (declares `upstream v4_app`)
#           — it is NOT declared anywhere in the live config by default, and
#           without it this file fails to load.

server {
    listen 80;
    listen [::]:80;
    server_name legacy.flowsmartly.com;

    # `^~` so this wins over any later prefix match and is never swallowed by a
    # redirect. The webroot is dedicated and lives outside every application
    # directory and release path, so neither a V4 deploy nor a V5 publish can
    # remove the directory certbot is writing challenges into.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        access_log off;
    }

    # Everything else goes to the V4 application, unchanged. The point of the
    # legacy host is continuity: it must behave like the app customers already
    # use, from the moment the name resolves.
    location / {
        proxy_pass         http://v4_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
        root /var/www/flowsmartly-maintenance;
        rewrite ^.*$ /maintenance.html break;
        add_header Retry-After   "1800"     always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }
}
