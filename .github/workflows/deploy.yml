name: Deploy to VPS

# Fires on every push/merge to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to deploy (default: main)"
        required: false
        default: main

# Never let two deploys run at once; the newer one waits for the current to finish.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Connect timeout — bumped from the 30s default; the runner has intermittently
          # hit "dial tcp :22: i/o timeout" reaching the VPS within 30s.
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd /opt/flowsmartly
            # Bootstrap: make sure the deploy script itself is up to date,
            # then hand off — the script does the real fetch/reset/build/reload.
            git fetch --prune origin
            git checkout origin/${{ github.event.inputs.ref || 'main' }} -- scripts/deploy-vps.sh
            chmod +x scripts/deploy-vps.sh
            DEPLOY_REF="origin/${{ github.event.inputs.ref || 'main' }}" ./scripts/deploy-vps.sh
