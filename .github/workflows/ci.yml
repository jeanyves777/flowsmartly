name: CI

# Pre-merge gate: type-check every pull request so type/import errors are caught
# BEFORE merge (and thus before the VPS deploy build runs on main). Needs no DB or
# secrets — `tsc` is the same type check `next build` enforces, minus the heavy bundle.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check
        env:
          # Big repo — give tsc room so it never OOMs on the runner.
          NODE_OPTIONS: --max-old-space-size=8192
