name: CI

# Pre-merge gate: type-check every pull request so type/import errors are caught
# BEFORE merge (and thus before the VPS deploy build runs on main). Needs no DB or
# secrets — `tsc` is the same type check `next build` enforces, minus the heavy bundle.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: Node's test runner only accepts glob patterns for
          # `--test` from 22 onward, and 20 answers "Could not find
          # 'src/**/*.test.ts'" and exits 1.
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The lockfile is resolved with legacy peer-deps (the Claude Agent SDK declares a
        # zod@^4 peer while the app pins zod@^3); match that so `npm ci` doesn't ERESOLVE.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check
        env:
          # Big repo — give tsc room so it never OOMs on the runner.
          NODE_OPTIONS: --max-old-space-size=8192

      # Unit tests, on Node's own runner via tsx — no test framework to install.
      # These are the plants for anything that files data with a regulator or
      # moves money, where "the code looks right" has repeatedly not been enough.
      - name: Unit tests
        run: npm test

  # `apps/v5` is a separate Expo application. The root gate excludes it, so it
  # gets its own — excluding it alone would make CI green by no longer checking
  # V5 rather than by V5 being correct.
  v5-type-check:
    name: Type check (apps/v5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/v5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # The type check above cannot see a broken export: `expo export` can fail, or
  # silently drop routes, on code that type-checks perfectly. Since the V5 site
  # is deployed as a static export, an export that does not run is an outage —
  # so CI runs the real one and asserts the site it produced is complete.
  #
  # It also covers what tsc structurally cannot here: `.expo/types/router.d.ts`
  # is gitignored, so on a fresh checkout expo-router's Href type is permissive
  # and a push() to a route that does not exist type-checks clean. The export
  # is what proves the route file is really there.
  v5-export:
    name: Web export (apps/v5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/v5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare clean marketing source snapshot for receipt
        run: |
          source_sha="$(git rev-parse --verify HEAD)"
          git worktree add --detach "$RUNNER_TEMP/v5-marketing-source" "$source_sha"
          test -z "$(git -C "$RUNNER_TEMP/v5-marketing-source" status --porcelain --untracked-files=all)"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Test public control feedback selectors
        run: npm run test:public-controls

      - name: Build web export
        run: npm run build:web
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Use the reviewed, pinned V5 apex config fixture
        # The separate V5 repository is private to the deployment operator.
        # The fixture's pinned Git blob SHA is checked by the test suite.
        run: test -f scripts/fixtures/nginx-apex-v5.conf

      - name: Test the V5 apex entry verifier and receipt
        run: npm run test:apex-entry
        env:
          V5_APEX_CONFIG: ${{ github.workspace }}/apps/v5/scripts/fixtures/nginx-apex-v5.conf
          V5_MARKETING_REPO: ${{ runner.temp }}/v5-marketing-source
          V5_MARKETING_EXPORT: ${{ github.workspace }}/apps/v5/dist
          V5_RECEIPT_OUT: ${{ runner.temp }}/v5-marketing-export-receipt.json

      - name: Upload source-bound V5 marketing export receipt
        uses: actions/upload-artifact@v4
        with:
          name: v5-marketing-export-receipt
          path: ${{ runner.temp }}/v5-marketing-export-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify the V5 marketing export against its source routes
        # This repository owns the static public marketing export ONLY.
        # deploy/nginx-flowsmartly-v5.conf is an obsolete historical vhost
        # which proxies to V4 and expects a waitlist/legacy sign-in. It must
        # NEVER be used as the V5 apex or promoted by this workflow.
        #
        # The authoritative V5 apex is:
        #   jeanyves777/flowsmartly-v5:deploy/nginx-apex-v5.conf
        # Its real routing/Stripe/callback constraints are independently
        # validated by tests/nginx-apex-cutover.test.ts in that repository.
        # This job therefore validates *all exported pages and route assets*
        # without treating the V4 historical nginx file as the shipping contract.
        # A live release still requires the independent V5 nginx proof.
        working-directory: ${{ github.workspace }}
        run: node scripts/precheck-v5-routes.mjs --skip-conf
