name: CI

# Pre-merge gate: type-check every pull request so type/import errors are caught
# BEFORE merge (and thus before the VPS deploy build runs on main). Needs no DB or
# secrets — `tsc` is the same type check `next build` enforces, minus the heavy bundle.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The lockfile is resolved with legacy peer-deps (the Claude Agent SDK declares a
        # zod@^4 peer while the app pins zod@^3); match that so `npm ci` doesn't ERESOLVE.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check
        env:
          # Big repo — give tsc room so it never OOMs on the runner.
          NODE_OPTIONS: --max-old-space-size=8192

  data-form-security:
    name: Public form security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Pins the rules that are easy to regress by accident: that consent comes
      # from a ticked box and never from possessing an address, and that every
      # detail a self-entry form collects has a field definition behind it (the
      # owner's submissions view renders answers by iterating form.fields).
      - name: Public form security tests
        run: npm run test:data-forms
