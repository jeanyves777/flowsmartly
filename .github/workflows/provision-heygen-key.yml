name: Provision HEYGEN_API_KEY to VPS

# One-shot manual utility: writes the encrypted HEYGEN_API_KEY secret into the
# VPS app's .env (/opt/flowsmartly/.env) and reloads pm2 so the running app
# picks it up. The key value is NEVER stored in the repo and is masked in logs.
on:
  workflow_dispatch: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert HEYGEN_API_KEY into VPS .env and reload
        uses: appleboy/ssh-action@v1.2.0
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 120s
          command_timeout: 10m
          envs: HEYGEN_API_KEY
          script: |
            set -e
            cd /opt/flowsmartly
            touch .env
            # Idempotent upsert: drop any existing line, append the fresh value.
            grep -v '^HEYGEN_API_KEY=' .env > .env.provision.tmp || true
            mv .env.provision.tmp .env
            printf 'HEYGEN_API_KEY=%s\n' "$HEYGEN_API_KEY" >> .env
            chmod 600 .env
            # Reload the app so Next re-reads .env (zero-downtime when online).
            pm2 reload flowsmartly || pm2 restart flowsmartly || true
            echo "HEYGEN_API_KEY provisioned (length=${#HEYGEN_API_KEY}); pm2 reloaded."
